<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo</h1>

      <form id="new-task-form" class="new-task" autocomplete="off">
        <label for="new-task-title" class="visually-hidden">New task</label>
        <input id="new-task-title" type="text" placeholder="What needs doing?" maxlength="200" required />
        <button type="submit">Add</button>
        <div class="new-task-extra">
          <label class="field">
            <span>Due</span>
            <input id="new-task-due" type="date" />
          </label>
          <label class="field">
            <span>Repeat</span>
            <select id="new-task-repeat">
              <option value="">Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekdays">Weekdays</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="new-task-priority">
              <option value="">None</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label class="field tags-field">
            <span>Tags</span>
            <input id="new-task-tags" type="text" placeholder="work, home" maxlength="200" />
          </label>
        </div>
      </form>

      <p id="error" class="error" role="alert" hidden></p>

      <div class="search" role="search">
        <label for="search-input" class="visually-hidden">Search tasks</label>
        <input id="search-input" type="text" placeholder="Search title or #tag" maxlength="100" autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>✕</button>
      </div>

      <div class="filters" aria-label="Filters">
        <div class="status-filter" role="group" aria-label="Show">
          <button type="button" data-status="all" aria-pressed="true">All</button>
          <button type="button" data-status="active" aria-pressed="false">Active</button>
          <button type="button" data-status="completed" aria-pressed="false">Completed</button>
        </div>
        <div class="filter-selects">
          <label class="field tag-filter">
            <span>Tag</span>
            <select id="tag-filter">
              <option value="">All tags</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="priority-filter">
              <option value="">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
              <option value="none">No priority</option>
            </select>
          </label>
          <label class="field">
            <span>Sort</span>
            <select id="sort-select">
              <option value="created">Created</option>
              <option value="priority">Priority</option>
              <option value="due">Due date</option>
            </select>
          </label>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty" hidden></p>
      <p id="counter" class="counter" aria-live="polite"></p>
    </main>

    <script src="recurrence.js"></script>
    <script src="priority.js"></script>
    <script src="search.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
  </body>
</html>
